; Lets the admin accept large phone photos (they are resized automatically)
; and software or course files for Courses & Tools (up to 256 MB).
; Many shared hosts read this file; if uploads over 2-8 MB still fail, raise
; these in cPanel > MultiPHP INI Editor instead.
upload_max_filesize = 256M
post_max_size = 260M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
